name: Offline regression tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        component: [macro, micro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '${{ matrix.component }}/requirements.txt'
      - run: python -m pip install -r '${{ matrix.component }}/requirements.txt'
      - run: python -B -m unittest discover -s tests -p 'test_jev*.py'
        working-directory: '${{ matrix.component }}'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
